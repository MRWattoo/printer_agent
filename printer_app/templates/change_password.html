{% extends "base_layout.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
  <div class="card">
    <form method="post">
      <div style="display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; padding-bottom:1rem; margin-bottom:1.25rem; border-bottom:1px solid #e5e7eb;">
        <h2 style="margin:0; flex:1 1 auto;">Change Password</h2>
        <button type="submit" style="background:#0f3460; color:#fff; padding:.6rem 1.5rem; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Change Password</button>
        <a href="{{ url_for('index') }}" style="background:#e5e7eb; color:#374151; padding:.6rem 1.2rem; border-radius:6px; text-decoration:none;">Cancel</a>
      </div>
      {% if own_password %}
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" required style="width:100%; padding:.5rem; margin-bottom:1rem; border:1px solid #ddd; border-radius:4px;">
      {% endif %}
      <label for="new_password">New Password</label>
      <input type="password" id="new_password" name="new_password" required style="width:100%; padding:.5rem; margin-bottom:1rem; border:1px solid #ddd; border-radius:4px;">
      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required style="width:100%; padding:.5rem; margin-bottom:1rem; border:1px solid #ddd; border-radius:4px;">
    </form>
  </div>
{% endblock %}
